name: AraquariDesk Server CI

on:
  push:
    paths:
      - "araquaridesk-server/**"
      - ".github/workflows/araquaridesk-server-ci.yml"
  pull_request:
    paths:
      - "araquaridesk-server/**"
      - ".github/workflows/araquaridesk-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: araquaridesk_test
          POSTGRES_USER: araquaridesk
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U araquaridesk -d araquaridesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: araquaridesk-server
    env:
      DATABASE_URL: postgres://araquaridesk:test-only-password@127.0.0.1:5432/araquaridesk_test
      ARAQUARIDESK_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-bytes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.84"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: araquaridesk-server
      - name: Format sources for validation
        run: cargo fmt --all
      - name: Upload formatted server sources
        uses: actions/upload-artifact@v4
        with:
          name: araquaridesk-server-formatted
          path: araquaridesk-server/src
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Apply migrations
        run: cargo run --bin araquaridesk-admin -- list-users
